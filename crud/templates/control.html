{% extends "layout.html" %}
{% block body %}
<div class = "d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">Enviar comandos a nodos</h2>
  <a href="{{url_for('registrar_nodo')}}" class = "btn btn-primary">Registrar nuevo nodo</a>
</div>
<div class="container mt-5">
  <form method="POST" class="card p-4 shadow-sm rounded">
    <div class="mb-3">
      <label class="form-label">Seleccioná un nodo:</label><br>
      {% for nodo in nodos %}
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="nodo" id="{{ nodo[0] }}" value="{{ nodo[0] }}" required>
          <label class="form-check-label" for="{{ nodo[0] }}">{{  nodo[0]  }}, "{{  nodo[1]  }}"</label>
        </div>
      {% endfor %}
    </div>
    <div class="mb-3">
      <label for="setpoint" class="form-label">Setpoint</label>
      <input type="number" class="form-control" id="setpoint" name="setpoint" placeholder="Ej: 25" required>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="destello" name="destello">
      <label class="form-check-label" for="destello">Activar destello</label>
    </div>
    <button type="submit" class="btn btn-success">Enviar comando</button>
  </form>
</div>
{% endblock %}
